[package]
name = "rameau"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SoundFont-based MIDI playback behind a high-level MusicEngine"
# Large SoundFont banks are runtime sample assets, not compiled into the crate;
# excluding them keeps the published package under crates.io's 10 MiB limit.
exclude = ["assets"]

[dependencies]
rameau_kira = { path = "crates/rameau_kira", version = "0.2.0" }
rameau_midi = { path = "crates/rameau_midi", version = "0.2.0" }
rameau_playback = { path = "crates/rameau_playback", version = "0.2.0" }
rameau_soundfont = { path = "crates/rameau_soundfont", version = "0.2.0" }
rameau_synthesizer = { path = "crates/rameau_synthesizer", version = "0.2.0" }
rameau_unison = { path = "crates/rameau_unison", version = "0.2.0", optional = true }

[features]
default = []
# Embeds the Unison bank (about 6.6 MiB) and enables `MusicEngine::new()`,
# which needs no SoundFont file. Off by default so that callers who supply
# their own bank do not pay for one they will not use.
unison = ["dep:rameau_unison"]

[[example]]
name = "play_unison"
required-features = ["unison"]

[lints]
workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lizelive/rameau"
homepage = "https://github.com/lizelive/rameau"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
unnecessary_safety_comment = "deny"
unreachable = "deny"
empty_loop = "deny"
needless_borrow = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
large_stack_arrays = "deny"
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
inefficient_to_string = "deny"
map_clone = "deny"
map_collect_result_unit = "deny"
slow_vector_initialization = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
bool_comparison = "deny"
let_unit_value = "deny"

# The Ogg/Vorbis codecs are C libraries compiled through `cc`, and are unusably
# slow at the debug default of `opt-level = 0` — converting a 655-sample bank
# goes from seconds to many minutes, which makes the conversion tests look like
# they have hung. `cc` reads Cargo's per-package `OPT_LEVEL`, so these raise the
# optimisation level of the bundled C sources too, not just the Rust wrappers.
#
# These must live in the workspace root: Cargo only honours `[profile.*]` in a
# workspace's root manifest and ignores it in members, so this is both the only
# place they work and the place that makes them apply workspace-wide, however
# the build was invoked.
#
# `profile.test` and `profile.bench` inherit from `profile.dev`, so test builds
# are covered without repeating this. `profile.release` is already `opt-level = 3`.
[profile.dev.package.vorbis_rs]
opt-level = 3

[profile.dev.package.aotuv_lancer_vorbis_sys]
opt-level = 3

[profile.dev.package.ogg_next_sys]
opt-level = 3

# The decoder side: `rameau_soundfont` decodes .sf3 banks with lewton, and the
# conversion tests decode a whole bank back to verify the round-trip.
[profile.dev.package.lewton]
opt-level = 3
